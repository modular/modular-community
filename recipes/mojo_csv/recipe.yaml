context:
  version: 1.8.0
package:
  name: "mojo_csv"
  version: ${{ version }}

source:
  - git: https://github.com/Phelsong/mojo_csv.git
    rev: 40eb123d930796a2147fc633aa668e9c9ed7d6ba

build:
  number: 0
  script:
    - mojo precompile src -o ${{ PREFIX }}/lib/mojo/mojo_csv.mojoc

requirements:
  host:
    - max >=26.3.0,<27.0
  run:
    - ${{ pin_compatible('max') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run -I $PREFIX/lib/mojo/mojo_csv.mojoc test_pack.mojo
    files:
      recipe:
        - test_pack.mojo
    requirements:
      run:
        - max >=26.3.0,<27.0

about:
  homepage: https://github.com/Phelsong/mojo_csv
  license: MIT
  license_file: LICENSE
  summary: Csv parsing library written in pure Mojo
  repository: https://github.com/Phelsong/mojo_csv

extra:
  maintainers:
    - phelsong
  project_name:
    - mojo_csv
