# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.2.1"
  mojo_version: "=1.0.0"
  rev: "b2fde00e920b8b61e138b7961e090c86dd2ed92f"

package:
  name: "mojo_raylib"
  version: ${{ version }}

source:
  - git: https://github.com/kivicode/mojo-raylib.git
    rev: ${{ rev }}

build:
  number: 0
  script:
    interpreter: bash
    content:
      - |
        set -euo pipefail
        bash shim/build.sh
        mkdir -p "${PREFIX}/lib/mojo"
        mojo precompile mojo_raylib -o "${PREFIX}/lib/mojo/mojo_raylib.mojoc"

requirements:
  build:
    - ${{ compiler('c') }}
    - cmake
    - ninja
    - patchelf
  host:
    - mojo-compiler ${{ mojo_version }}
    - if: linux
      then:
        - xorg-xorgproto
        - xorg-libx11
        - xorg-libxrandr
        - xorg-libxinerama
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxext
        - libgl-devel
  run:
    - mojo-compiler ${{ mojo_version }}
    - if: linux
      then:
        - xorg-libx11
        - xorg-libxrandr
        - xorg-libxinerama
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxext
        - libgl

tests:
  - script:
      - if: unix
        then:
          - mojo --version
    requirements:
      run:
        - mojo ${{ mojo_version }}

about:
  homepage: https://github.com/kivicode/mojo-raylib
  license: Zlib
  summary: |
    Auto-generated Mojo bindings for raylib (2D/3D graphics library)
  repository: https://github.com/kivicode/mojo-raylib

extra:
  maintainers:
    - kivicode
  project_name: mojo_raylib
