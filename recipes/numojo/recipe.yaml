context:
  version: "0.10.0"
  mojo_version: ">=1.0.0,<1.1.0"

package:
  name: "numojo"
  version: ${{ version }}

source:
  - git: https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo.git
    rev: 515fb2856f0ecf3d2740a34d958fe168183e1129

build:
  number: 0
  script:
      - mkdir -p ${PREFIX}/lib/mojo
      - mojo precompile src/decimo -o ${PREFIX}/lib/mojo/decimo.mojoc

requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
  build:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}

about:
  homepage: https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo
  license: Apache-2.0
  license_file: LICENSE
  summary: NuMojo is a library for numerical computing in Mojo 🔥, similar to NumPy in Python.
  repository: https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo

extra:
  project_name: NuMojo
  maintainers:
    - shivasankarka
    - MadAlex1997
    - forFudan
    - sandstromviktor
    - durnwalder
    - sauterp
