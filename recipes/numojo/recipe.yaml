context:
  version: "0.12.0"
  mojo_version: ">=1.2.0,<1.3.0"
  max_core_version: ">=26.7.0,<26.8"

package:
  name: "numojo"
  version: ${{ version }}

source:
  - git: https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo.git
    rev: c9b3f07d4cb7600002d4c9bf79d4617aec32304b

build:
  number: 0
  script:
      - mkdir -p ${{ PREFIX }}/lib/mojo
      - mojo precompile -I ${{ PREFIX }}/lib/mojo numojo -o ${{ PREFIX }}/lib/mojo/numojo.mojoc

requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
    - max-core ${{ max_core_version }}
  build:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}
    - max-core ${{ max_core_version }}

about:
  homepage: https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo
  license: Apache-2.0
  license_file: LICENSE
  summary: NuMojo is a library for numerical computing in Mojo 🔥, similar to NumPy in Python.
  repository: https://github.com/Mojo-Numerics-and-Algorithms-group/NuMojo

extra:
  project_name: NuMojo
  maintainers:
    - shivasankarka
    - MadAlex1997
    - forFudan
    - sandstromviktor
    - durnwalder
    - sauterp
