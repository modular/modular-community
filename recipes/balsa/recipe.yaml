context:
  version: "0.2.1"
  mojo_version: "==1.2.0"
  max_version: "==26.7.0"

package:
  name: balsa
  version: ${{ version }}

source:
  - git: https://github.com/idlab-discover/balsa.git
    rev: df991523746e2cc618e361f2a73ba7b8999ebace

build:
  number: 0
  # Linux x86-64 is the only platform the project builds and tests.
  skip:
    - target_platform != "linux-64"
  files:
    - lib/mojo/balsa.mojoc
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile -I ${{ PREFIX }}/lib/mojo src/balsa -o ${{ PREFIX }}/lib/mojo/balsa.mojoc

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
    - max-core ${{ max_version }}
  run:
    - mojo-compiler ${{ mojo_version }}
    - max-core ${{ max_version }}

tests:
  - script:
      # No source include path: imports must resolve to the installed package.
      - mojo run conda.recipe/test.mojo
    requirements:
      run:
        - gcc_linux-64
    files:
      source:
        - conda.recipe/test.mojo

about:
  homepage: https://github.com/idlab-discover/balsa
  repository: https://github.com/idlab-discover/balsa
  license: Apache-2.0
  license_file:
    - LICENSE
    - LICENSES/Treelite.txt
    - THIRD_PARTY_NOTICES.md
  summary: Native Mojo storage and editing for Treelite v4 checkpoints

extra:
  project_name: balsa
  maintainers:
    - Str-Gen
