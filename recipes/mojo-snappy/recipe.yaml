context:
  version: "0.2.0"
  mojo_version: "==1.0.0"

package:
  name: mojo-snappy
  version: ${{ version }}

source:
  - git: https://github.com/idlab-discover/mojo-snappy.git
    rev: 1bb71bec224d3d262d6a542dd872da7f2a665b9c

build:
  number: 0
  # Linux x86-64 is the only platform the project builds and tests.
  skip:
    - target_platform != "linux-64"
  files:
    - lib/mojo/mojo_snappy.mojoc
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile src/mojo_snappy -o ${{ PREFIX }}/lib/mojo/mojo_snappy.mojoc

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}

tests:
  - script:
      # No source include path: imports must resolve to the installed package.
      - mojo build -O3 -D ASSERT=all tests/test_snappy.mojo -o test-all
      - ./test-all
      - mojo build -O3 -D ASSERT=none tests/test_snappy.mojo -o test-none
      - ./test-none
      - mojo run examples/roundtrip.mojo
    requirements:
      run:
        - gcc_linux-64
    files:
      source:
        - tests/test_snappy.mojo
        - examples/roundtrip.mojo

about:
  homepage: https://github.com/idlab-discover/mojo-snappy
  repository: https://github.com/idlab-discover/mojo-snappy
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
  summary: Raw Snappy block compression and decompression in Mojo

extra:
  project_name: mojo-snappy
  maintainers:
    - Str-Gen
