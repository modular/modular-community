syntax = "proto3";

import "google/protobuf/any.proto";

enum SmokeState {
  SMOKE_STATE_UNSPECIFIED = 0;
  SMOKE_STATE_READY = 1;
}

message PackageSmoke {
  uint32 request_id = 1;
  string payload = 2;
  SmokeState state = 3;
  google.protobuf.Any metadata = 4;
}

message PackagePayload {
  string note = 1;
}
