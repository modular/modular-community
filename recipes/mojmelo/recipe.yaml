context:
  version: "0.1.7"

package:
  name: "mojmelo"
  version: ${{ version }}

source:
  - git: https://github.com/yetalit/mojmelo.git
    rev: 489197c7bbcdf1225e88d1609c75a9c7fca6cad2

build:
  number: 1
  script:
    - mojo precompile pixi/mojmelo/linalg/mojmelo_matmul -o ${{ PREFIX }}/lib/mojo/mojmelo_matmul.mojoc
    - mojo precompile pixi/mojmelo -o ${{ PREFIX }}/lib/mojo/mojmelo.mojoc
requirements:
  host:
    - mojo-compiler >=1.2.0,<2
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo tests/setup.mojo
    requirements:
      run:
        - mojo-compiler >=1.2.0,<2
    files:
      recipe:
        - tests/setup.mojo
        - tests/setup.sh
        - tests/mojmelo_tmp/__init__.mojo
        - tests/mojmelo_tmp/linalg/*.mojo
        - tests/mojmelo_tmp/linalg/mojmelo_matmul/*.mojo

about:
  homepage: https://github.com/yetalit/Mojmelo
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Machine Learning algorithms in pure Mojo.
  repository: https://github.com/yetalit/Mojmelo

extra:
  project_name: Mojmelo
  maintainers:
    - yetalit
