context:
  version: "0.1.4"

package:
  name: "mojmelo"
  version: ${{ version }}

source:
  - git: https://github.com/yetalit/mojmelo.git
    rev: 49ee72f601beb0df51b143a4a5655c8bd515551e

build:
  number: 0
  script:
    - mojo precompile pixi/mojmelo/utils/mojmelo_matmul -o ${{ PREFIX }}/lib/mojo/mojmelo_matmul.mojoc
    - mojo precompile pixi/mojmelo -o ${{ PREFIX }}/lib/mojo/mojmelo.mojoc
requirements:
  host:
    - mojo-compiler =1.0.0b2
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo tests/setup.mojo
    requirements:
      run:
        - mojo-compiler =1.0.0b2
    files:
      recipe:
        - tests/setup.mojo
        - tests/setup.sh
        - tests/mojmelo/__init__.mojo
        - tests/mojmelo/utils/*.mojo
        - tests/mojmelo/utils/mojmelo_matmul/*.mojo

about:
  homepage: https://github.com/yetalit/Mojmelo
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Machine Learning algorithms in pure Mojo.
  repository: https://github.com/yetalit/Mojmelo

extra:
  project_name: Mojmelo
  maintainers:
    - yetalit
