{
  "package": {
    "name": "usd-mojo",
    "version": "0.2.0"
  },
  "source": {
    "git": "https://github.com/henlamp/usd-mojo.git",
    "rev": "8908e9815627d4d478edb59fe074166fb7962268"
  },
  "build": {
    "number": 0,
    "string": "mojo120_0",
    "skip": "not ((osx and arm64) or (linux and x86_64))",
    "files": [
      "lib/mojo/usd_mojo.mojoc",
      "lib/libusd_mojo_bridge.*",
      "bin/usd-mojo-build",
      "share/usd-mojo/**"
    ],
    "script": [
      "python tools/conda_install.py"
    ],
    "dynamic_linking": {
      "binary_relocation": false
    },
    "python": {
      "skip_pyc_compilation": [
        "**/*.py"
      ]
    }
  },
  "requirements": {
    "build": [
      "python 3.12.*",
      "mojo-compiler ==1.2.0",
      "cmake >=3.30,<5",
      "ninja >=1.12,<2",
      "cxx-compiler ==2.0.0",
      {
        "if": "linux",
        "then": "sysroot_linux-64 ==2.28"
      }
    ],
    "host": [
      "mojo-compiler ==1.2.0",
      "openusd ==26.08",
      "python 3.12.*",
      {
        "if": "osx",
        "then": "libcxx ==23.1.3"
      },
      "tbb ==2023.0.0",
      {
        "if": "linux",
        "then": [
          "libgcc ==15.3.0",
          "libstdcxx ==15.3.0"
        ]
      }
    ],
    "run": [
      "mojo-compiler ==1.2.0",
      "openusd ==26.08",
      "python 3.12.*",
      {
        "if": "osx",
        "then": [
          "__osx >=13.0",
          "libcxx >=23.1.3,<24"
        ]
      },
      "tbb >=2023.0.0,<2024",
      {
        "if": "linux",
        "then": [
          "__glibc >=2.28",
          "libgcc >=15.3.0,<16",
          "libstdcxx >=15.3.0,<16"
        ]
      }
    ]
  },
  "tests": [
    {
      "script": [
        "usd-mojo-build smoke.mojo -o consumer",
        "./consumer scene.usda"
      ],
      "files": {
        "recipe": [
          "smoke.mojo",
          "scene.usda"
        ]
      }
    }
  ],
  "about": {
    "homepage": "https://github.com/henlamp/usd-mojo",
    "repository": "https://github.com/henlamp/usd-mojo.git",
    "license": "MIT",
    "license_file": [
      "LICENSE",
      "THIRD_PARTY_NOTICES.md",
      "licenses/OpenUSD-LICENSE.txt",
      "licenses/OpenUSD-NOTICE.txt",
      "licenses/MaterialX-LICENSE.txt"
    ],
    "summary": "Typed Mojo access to OpenUSD scenes and geometry"
  },
  "extra": {
    "maintainers": [
      "henlamp"
    ]
  }
}
