context:
  version: "1.1.0"

package:
  name: "pion-slab"
  version: ${{ version }}

source:
  - git: https://github.com/pavelhorak/pion.git
    tag: v${{ version }}

build:
  number: 0
  script:
    - python3 packages/build.py pion_slab --assemble-only
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile build/mojo-packages/src/pion_slab -o ${{ PREFIX }}/lib/mojo/pion_slab.mojoc

requirements:
  build:
    - mojo-compiler =1.2.0
    - python >=3.11
  host:
    - mojo-compiler =1.2.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - mojo run -I $PREFIX/lib/mojo packages/pion_slab/tests/test_slab.mojo
    files:
      source:
        - packages/pion_slab/tests/
    requirements:
      build:
        - mojo =1.2.0
      run:
        - mojo =1.2.0

about:
  homepage: https://github.com/pavelhorak/pion
  license: Apache-2.0
  license_file: LICENSE
  summary: "An mmap-backed slab allocator and a fixed-capacity object pool: O(1) allocate and free, no per-object heap call, from Pion's server"
  repository: https://github.com/pavelhorak/pion

extra:
  maintainers:
    - pavelhorak
  project_name:
    - Pion
