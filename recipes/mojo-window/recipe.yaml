context:
  version: "0.3.0"
  mojo_version: "=1.1.0"

package:
  name: mojo-window
  version: ${{ version }}

source:
  - git: https://github.com/Maelkiz/mojo-window.git
    rev: 11058ecf208bdf5f470c448364771989b0eeeaf3

build:
  number: 0
  script:
    - mojo precompile src/window -o ${{ PREFIX }}/lib/mojo/window.mojoc

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}
    - sdl3 >=3.4,<4

tests:
  - script:
      - if: unix
        then:
          - mojo run test.mojo
    files:
      recipe:
        - test.mojo

about:
  homepage: https://github.com/Maelkiz/mojo-window
  repository: https://github.com/Maelkiz/mojo-window
  license: MIT
  license_file: LICENSE
  summary: SDL3-based windowing library for Mojo

extra:
  maintainers:
    - Maelkiz
