schema_version: 1

context:
  version: 0.1.1
  mojo_version: "=1.1.0"

package:
  name: mojo2wasm
  version: ${{ version }}

source:
  git: https://github.com/ravioli67/mojo2wasm.git
  tag: v${{ version }}

build:
  number: 0
  script:
    - mkdir -p $PREFIX/lib/mojo
    - mojo package src -o $PREFIX/lib/mojo/mojo2wasm.mojopkg

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - package_contents:
      files:
        - lib/mojo/mojo2wasm.mojopkg

about:
  homepage: https://github.com/ravioli67/mojo2wasm
  license: MIT
  license_file: LICENSE.md
  summary: A library to convert Mojo to WebAssembly
  description: |
    An experimental, self-hosted compiler frontend written entirely
    in Mojo to compile Mojo source code into WebAssembly (Wasm).

    The goal of this project is to bridge the gap between Mojo's
    high-performance systems programming capabilities and the web/edge
    ecosystem.
  documentation: https://github.com/ravioli67/mojo2wasm/blob/main/README.md
  repository: https://github.com/ravioli67/mojo2wasm

extra:
  recipe-maintainers:
    - ravioli67
