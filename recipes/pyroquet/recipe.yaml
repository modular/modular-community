context:
  version: "0.1.1"

package:
  name: pyroquet
  version: ${{ version }}

source:
  - git: https://github.com/idlab-discover/pyroquet.git
    rev: a923b5926a2867f82fee8f9e4d7c4443793165a6

build:
  number: 1
  skip:
    - target_platform != "linux-64"
  files:
    - lib/mojo/pyroquet.mojoc
    - lib/mojo/compact_protocol.mojoc
  script:
    - mkdir -p "$PREFIX/lib/mojo"
    - mojo precompile src/compact_protocol -o "$PREFIX/lib/mojo/compact_protocol.mojoc"
    - mojo precompile -I "$PREFIX/lib/mojo" src/pyroquet -o "$PREFIX/lib/mojo/pyroquet.mojoc"

requirements:
  build:
    - mojo-compiler ==1.0.0
  host:
    - mojo-compiler ==1.0.0
    - max-core ==26.5.0
    - numojo ==0.10.0
    # CI's local Snappy rebuild targets a newer compiler; select the published Mojo 1.0 build.
    - https://prefix.dev/modular-community::mojo-snappy ==0.2.0 hb0f4dca_0
    - libzlib ==1.3.2
    - zstd ==1.5.7
  run:
    - mojo-compiler ==1.0.0
    - max-core ==26.5.0
    - numojo ==0.10.0
    - https://prefix.dev/modular-community::mojo-snappy ==0.2.0 hb0f4dca_0
    - libzlib ==1.3.2
    - zstd ==1.5.7

tests:
  - script:
      - |
        set -eu
        export LD_LIBRARY_PATH="$PREFIX/lib"
        for assertion in all none; do
          for test in tests/release/package_smoke.mojo tests/test_numeric_write.mojo tests/test_snappy_pages.mojo tests/test_gzip_writes.mojo tests/test_zstd.mojo; do
            mojo build -O3 -D ASSERT="$assertion" -I tests "$test" -o package-test
            ./package-test
          done
        done
    requirements:
      run:
        - gcc_linux-64
        # Runtime metadata drops channel qualifiers; repeat it for the CI test solve.
        - https://prefix.dev/modular-community::mojo-snappy ==0.2.0 hb0f4dca_0
    files:
      source:
        - tests/release/package_smoke.mojo
        - tests/test_numeric_write.mojo
        - tests/test_snappy_pages.mojo
        - tests/test_gzip_writes.mojo
        - tests/test_zstd.mojo
        - tests/temp_directory.mojo

about:
  homepage: https://github.com/idlab-discover/pyroquet
  repository: https://github.com/idlab-discover/pyroquet
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - licenses/NUMOJO-LICENSE
    - licenses/MOJO-SNAPPY-LICENSE
    - licenses/MOJO-SNAPPY-THIRD-PARTY-NOTICES.md
    - licenses/ZLIB-LICENSE
    - licenses/ZSTD-LICENSE
  summary: Native Mojo Parquet reading and writing with typed columns and nullable nested data

extra:
  project_name: Pyroquet
  maintainers:
    - Str-Gen
