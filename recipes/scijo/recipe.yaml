context:
  version: "0.3.0"
  mojo_version: "==1.1.0"
  numojo_version: "==0.11.0"

package:
  name: scijo
  version: ${{ version }}

source:
  - git: https://github.com/mojomath/SciJo.git
    rev: 91cc86f211447ab01b4e3dac4761ad874d968ce6

build:
  number: 0
  script:
    - mkdir -p "${PREFIX}/lib/mojo"
    - mojo precompile -I "${PREFIX}/lib/mojo" scijo -o "${PREFIX}/lib/mojo/scijo.mojoc"

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
    - numojo ${{ numojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}
    - numojo ${{ numojo_version }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test.mojo
    files:
      recipe:
        - test.mojo

about:
  homepage: https://github.com/mojomath/SciJo
  repository: https://github.com/mojomath/SciJo
  license: Apache-2.0
  license_file: LICENSE
  summary: SciPy-inspired scientific computing for Mojo, built on NuMojo.

extra:
  project_name: SciJo
  maintainers:
    - shivasankarka
