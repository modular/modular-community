context:
  version: "0.2.0"
  mojo_version: "==1.0.0"

package:
  name: "msl"
  version: ${{ version }}

source:
  - git: https://github.com/mojomath/MSL.git
    rev: 457f3fc884a34bda098460927ddbae145d0a6293

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile -I ${{ PREFIX }}/lib/mojo msl -o ${{ PREFIX }}/lib/mojo/msl.mojoc

requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
    - mojoblas
  build:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}
    - mojoblas

about:
  homepage: https://github.com/mojomath/MSL
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Mojo Scientific Library (MSL) is a comprehensive collection of scientific computation routines derived from GNU Scientific Library (GSL) written in pure Mojo.
  repository: https://github.com/mojomath/MSL

extra:
  project_name: msl
  maintainers:
    - shivasankarka
