context:
  build_number: 0
  version: 0.1.3
  release: 0.1.3-compiler-1.0.0
  artifact_sha256: 0f5ac759faea1683d35e23547ed33e573153a16145c96f3b203892ceab471642

about:
  homepage: https://github.com/martinvuyk/mojo_datetime
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE
  summary: A flexible Mojo datetime library implementation
  repository: https://github.com/martinvuyk/mojo_datetime

extra:
  maintainers:
    - martinvuyk
  project_name:
    - mojo_datetime

source:
  - git: https://github.com/martinvuyk/mojo_datetime.git
    tag: ${{ release }}
  - url: https://github.com/martinvuyk/mojo_datetime/releases/download/${{ release }}/mojo_datetime.mojoc
    sha256: ${{ artifact_sha256 }}

package:
  name: "mojo_datetime"
  version: ${{ version }}

build:
  number: ${{ build_number }}
  script:
    - cp mojo_datetime.mojoc ${{ PREFIX }}/lib/mojo/

requirements:
  host:
    - mojo-compiler =1.0.0
  build:
    - mojo-compiler =1.0.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}
