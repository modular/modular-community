context:
  version: "0.1.0"
  mojo_version: "1.0.0"

package:
  name: professor
  version: ${{ version }}

source:
  - git: https://github.com/gsmyridis/professor.git
    rev: a1de3dc427efcfcfc2f9be45686dd81632b49a32

build:
  number: 0
  script:
    - mojo precompile src/professor -o ${{ PREFIX }}/lib/mojo/professor.mojoc

requirements:
  build:
    - mojo-compiler ==${{ mojo_version }}
  host:
    - mojo-compiler ==${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test_package.mojo
    files:
      recipe:
        - tests/package/test.mojo

about:
  homepage: https://github.com/gsmyridis/professor
  repository: https://github.com/gsmyridis/professor
  license: MIT
  license_file: LICENSE
  summary: An instrumentation-based profiling library for Mojo.

extra:
  maintainers:
    - gsmyridis
