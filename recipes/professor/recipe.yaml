context:
  version: "0.1.0"
  mojo_version: "1.0.0"

package:
  name: professor
  version: ${{ version }}

source:
  - git: https://github.com/gsmyridis/professor.git
    rev: d9ba0f75f803ee49ba85d29981f765ec9dbf782c

build:
  number: 2
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - cp -R src/professor ${{ PREFIX }}/lib/mojo/

requirements:
  build:
    - mojo-compiler ==${{ mojo_version }}
  host:
    - mojo-compiler ==${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test.mojo
    files:
      recipe:
        - test.mojo

about:
  homepage: https://github.com/gsmyridis/professor
  repository: https://github.com/gsmyridis/professor
  license: MIT
  license_file: LICENSE
  summary: An instrumentation-based profiling library for Mojo.

extra:
  maintainers:
    - gsmyridis
