context:
  version: 0.21.0
  mojo_version: "=1.0.0"
about:
  description: "# Mojo Regex\nRegular Expressions Library for Mojo\n\n`mojo-regex` is a\
    \ regex library featuring a hybrid DFA/NFA/PikeVM/LazyDFA engine architecture\
    \ that automatically optimizes pattern matching based on complexity.\n\nIt aims\
    \ to provide a similar interface as the [re](https://docs.python.org/3/library/re.html)\
    \ stdlib package while leveraging Mojo's performance capabilities.\n\nBeats Python's\
    \ C-based `re` module on 97% of benchmarks. Beats Rust's `regex` crate on 83%.\n\
    \nSupports compile-time pattern specialization: pass the pattern as a comptime\
    \ parameter (`search[\"hello\"](text)`) and the regex is compiled while your program\
    \ builds."
  homepage: https://github.com/msaelices/mojo-regex
  license: MIT
  license_file: LICENSE
  repository: https://github.com/msaelices/mojo-regex
  summary: Library for dealing with regular expressions in Mojo
build:
  number: 0
  script:
  - mkdir -p ${PREFIX}/lib/mojo
  - mojo package src/regex -o ${PREFIX}/lib/mojo/regex.mojopkg
package:
  name: mojo-regex
  version: ${{ version }}
requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
  build:
    - mojo-compiler ${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler') }}
source:
  - git: https://github.com/msaelices/mojo-regex.git
    rev: b8c2045830321cf5a9716792f290a332748ec2e8