context:
  version: "0.16.0"
  mojo_version: ">=1.2.0,<1.3.0"

package:
  name: "decimo"
  version: ${{ version }}

source:
  - git: https://github.com/forfudan/decimo.git
    rev: c49b209ae9d115372b1d76f39ab414f073e8df3a

build:
  number: 0
  script:
    - mkdir -p ${PREFIX}/lib/mojo
    - mojo precompile src/decimo -o ${PREFIX}/lib/mojo/decimo.mojoc

requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
  build:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}

about:
  homepage: https://github.com/forfudan/decimo
  license: Apache-2.0
  license_file: LICENSE
  summary: An arbitrary-precision integer, decimal, binary floating-point, and rational library for Mojo, written in pure Mojo, with a 128-bit fixed-point decimal type as well.
  repository: https://github.com/forfudan/decimo.git

extra:
  project_name: decimo
  maintainers:
    - forfudan
