context:
  version: "0.0.5"
  mojo_version: "=1.2.0"

package:
  name: "mav"
  version: ${{ version }}

source:
  - git: https://gitlab.com/josiahls/mav.git
    rev: 9e6a940ba92babc450320e5e861efa9d89734d07

build:
  number: 1
  script:
    - mkdir -p ${PREFIX}/lib/mojo
    - mojo precompile mav -o ${PREFIX}/lib/mojo/mav.mojoc


requirements:
  host:
    - mojo-compiler ${{ mojo_version }}
    - "ffmpeg ==8.0.1 *lgpl*"
  build:
    - mojo-compiler ${{ mojo_version }}
    - "ffmpeg ==8.0.1 *lgpl*"
  run:
    - mojo-compiler ${{ mojo_version }}
    - "ffmpeg ==8.0.1 *lgpl*"

about:
  homepage: https://gitlab.com/josiahls/mav
  license: Apache-2.0
  license_file: LICENSE
  summary: MAV (Mojo Audio Video) is a FFmpeg binding library for Mojo.
  repository: https://gitlab.com/josiahls/mav

extra:
  project_name: mav
  maintainers:
    - josiahls
