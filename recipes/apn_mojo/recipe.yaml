context:
  version: "1.0.1"
  mojo_version: "=1.1.0"

package:
  name: apn_mojo
  version: ${{ version }}

source:
  - git: https://github.com/Spellbound-Mojo/apn_mojo.git
    tag: v${{ version }}

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile -I src src/apn_mojo -o ${{ PREFIX }}/lib/mojo/apn_mojo.mojoc
    # The compiler leaves a first-run marker in the prefix; it is not part of the package.
    - rm -f ${{ PREFIX }}/share/max/firstActivation

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run docs/examples/first_integer.mojo
          - mojo run docs/examples/quickstart.mojo
          - mojo run docs/examples/batch_quickstart.mojo
    requirements:
      run:
        - mojo ${{ mojo_version }}
    files:
      source:
        - docs/examples/first_integer.mojo
        - docs/examples/quickstart.mojo
        - docs/examples/batch_quickstart.mojo

about:
  homepage: https://spellbound-mojo.github.io/apn_mojo/
  repository: https://github.com/Spellbound-Mojo/apn_mojo
  documentation: https://spellbound-mojo.github.io/apn_mojo/
  license: Apache-2.0
  license_file: LICENSE
  summary: Arbitrary-precision integers, rationals, floats, complex numbers and balls for Mojo, with NumPy-style arrays

extra:
  maintainers:
    - anatolvitold
  project_name:
    - APN Mojo
