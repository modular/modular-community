#
# recipe.yaml
# mosaic
#
# Created by Christian Bator on 03/11/2025
#
# Usage: rattler-build build --recipe rattler-build/recipe.yaml -c https://conda.modular.com/max -c conda-forge
#

context:
  version: "0.2.0"

package:
  name: mosaic
  version: ${{ version }}

source:
  - git: https://github.com/christianbator/mosaic.git
    rev: 75b1d97353a95f903981a0ac4757b1e250e86d7c

build:
  number: 0
  script: build/build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - if: osx
        then:
          - /usr/lib/swift/libswift*.dylib
requirements:
  build:
    - clangxx>=22.1.0,<23.0
    - mojo-compiler>=1.0,<2.0
    - max-core>=26.7.0,<27
  host:
    - mojo-compiler>=1.0,<2.0
    - max-core>=26.7.0,<27
    - if: osx
      then:
        - libcxx
  run:
    - ${{ pin_compatible('mojo-compiler') }}
    - ${{ pin_compatible('max-core') }}
    - if: osx
      then:
        - ${{ pin_compatible('libcxx') }}

tests:
  - script: |
      for test_file in tests/test_*.mojo; do
        mojo run ${test_file} || exit 1
      done
    requirements:
      run:
        - mojo-compiler>=1.0,<2.0
        - max-core>=26.7.0,<27
    files:
      source:
        - tests/**.mojo
        - tests/data/

about:
  homepage: https://github.com/christianbator/mosaic
  license: Apache-2.0
  license_file: LICENSE
  summary: An image processing library in Mojo
  repository: https://github.com/christianbator/mosaic
  documentation: https://github.com/christianbator/mosaic

extra:
  project_name: Mosaic
  maintainers:
    - christianbator
