name: Update lockfiles

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * *

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump pixi to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(sed -nE 's/^requires-pixi = ">=([0-9.]+)"$/\1/p' pixi.toml)
          latest=$(gh api repos/prefix-dev/pixi/releases/latest --jq .tag_name)
          latest=${latest#v}
          sed -i -E "s/^requires-pixi = \">=[0-9.]+\"$/requires-pixi = \">=${latest}\"/" pixi.toml
          if [ "$current" != "$latest" ]; then
            printf 'Bumps pixi from %s to %s.\n\n' "$current" "$latest" >> diff.md
          fi
      - name: Set up pixi
        uses: ./.github/actions/setup-pixi
        with:
          run-install: false
      - name: Update lockfiles
        run: |
          set -euo pipefail
          pixi update --json --no-install | pixi exec pixi-diff-to-markdown >> diff.md
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update pixi and lockfile
          title: Update pixi and lockfile
          body-path: diff.md
          branch: update-pixi
          base: main
          labels: pixi
          delete-branch: true
          add-paths: |
            pixi.lock
            pixi.toml
